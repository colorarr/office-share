<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>同桌 · 文件协作工作台 · 交互预览</title>
    <style>
      :root {
        --bg: #fff;
        --side: #f7f8fa;
        --ink: #272b32;
        --muted: #68717d;
        --line: #e9ecf0;
        --accent: #355f9a;
        --blue: #edf3fb;
        --danger: #ac4343;
        --green: #347453;
        --radius: 9px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
      }
      button {
        border: 0;
        background: none;
      }
      svg {
        width: 20px;
        height: 20px;
        vertical-align: middle;
        flex-shrink: 0;
        fill: currentColor;
      }
      button svg {
        pointer-events: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      input,
      select {
        min-height: 36px;
      }
      input,
      select,
      textarea {
        border: 1px solid #dce1e8;
        border-radius: 7px;
        padding: 8px 11px;
        background: #fff;
        color: var(--ink);
      }
      input::placeholder {
        color: #818894;
      }
      input[type="checkbox"] {
        min-height: 16px;
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #f0f2f5;
      }
      button.primary {
        background: #292e36;
        color: #fff;
        border: 1px solid #292e36;
      }
      button.primary:hover {
        background: #404752;
      }
      button.outline {
        border: 1px solid #dce1e8;
        background: #fff;
      }
      button.danger {
        color: var(--danger);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 13px;
        border-radius: 7px;
        white-space: nowrap;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        padding: 6px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .muted {
        color: var(--muted);
      }
      .tiny {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.4px;
        color: var(--muted);
        font-weight: 600;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        padding: 3px 7px;
        border-radius: 5px;
        background: #f0f2f5;
        color: #596371;
        white-space: nowrap;
      }
      .tag.green {
        background: #edf5ef;
        color: #347453;
      }
      .tag.blue {
        background: var(--blue);
        color: var(--accent);
      }
      .tag.red {
        background: #fbefef;
        color: var(--danger);
      }
      kbd {
        font-family: ui-monospace, SFMono-Regular, monospace;
        border: 1px solid #dce0e6;
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 11px;
        color: #727b87;
        background: #fff;
      }
      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 2px solid white;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        background: #e5eaf2;
        color: #4b5e7b;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .avatar.alt {
        background: #e7eee8;
        color: #52705a;
      }
      .avatar.sand {
        background: #f2eadd;
        color: #8b7254;
      }
      .avatars {
        display: flex;
        padding-left: 6px;
      }
      .avatars .avatar {
        margin-left: -6px;
      }
      .app {
        display: grid;
        grid-template-columns: 222px minmax(0, 1fr);
        min-height: 100dvh;
      }
      .sidebar {
        background: var(--side);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 28px 16px 20px;
        position: fixed;
        inset: 0 auto 0 0;
        width: 222px;
        z-index: 30;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 12px 29px;
      }
      .brand-mark {
        width: 33px;
        height: 33px;
        border-radius: 9px;
        background: #272e37;
        color: white;
        display: grid;
        place-items: center;
      }
      .brand-mark svg {
        width: 25px;
        height: 25px;
      }
      .brand-name {
        font-size: 20px;
        letter-spacing: 2px;
        font-weight: 650;
        line-height: 1.25;
      }
      .brand-sub {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #68717d;
        margin-top: 4px;
      }
      .company {
        margin: 0 4px 27px;
        padding: 10px;
        border: 1px solid #e1e5eb;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 9px;
        background: #fff;
      }
      .company .avatar {
        border-radius: 6px;
        background: #eaf0e9;
        color: #4d6752;
      }
      .nav-label {
        padding: 0 13px;
        margin-bottom: 8px;
        font-size: 11px;
        color: #68717d;
        letter-spacing: 1px;
      }
      .nav-group {
        display: grid;
        gap: 4px;
        margin-bottom: 24px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        text-align: left;
        gap: 11px;
        padding: 10px 13px;
        border-radius: 7px;
        min-height: 42px;
        width: 100%;
        color: #66707e;
      }
      .nav-item svg {
        width: 18px;
        height: 18px;
      }
      .nav-item.active {
        background: #e8eef6;
        color: #355477;
        font-weight: 600;
      }
      .nav-item .count {
        margin-left: auto;
        font-size: 11px;
        color: #68717d;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .quota {
        padding: 13px 12px 23px;
      }
      .meter {
        height: 4px;
        background: #e1e6ec;
        border-radius: 2px;
        overflow: hidden;
        margin: 10px 0;
      }
      .meter span {
        display: block;
        height: 100%;
        background: #788aa3;
      }
      .shell {
        grid-column: 2;
        min-width: 0;
      }
      .topbar {
        height: 73px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 32px;
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.97);
        z-index: 20;
      }
      .mobile-toggle {
        display: none;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 9px;
        max-width: 440px;
        width: 42%;
        min-width: 0;
        color: #68717d;
      }
      #searchKey {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        min-width: 42px;
        height: 25px;
        line-height: 1;
        padding: 3px 7px;
      }
      .search input {
        flex: 1 1 auto;
        border: 0;
        min-width: 0;
        padding-left: 0;
        width: 100%;
        outline: none;
        background: transparent;
      }
      .search svg {
        width: 18px;
      }
      .top-spacer {
        flex: 1;
      }
      .user-switch {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .user-switch select {
        border: 0;
        font-size: 12px;
        padding-left: 3px;
        max-width: 164px;
        background: none;
      }
      .divider {
        height: 24px;
        width: 1px;
        background: var(--line);
      }
      .top-transfer {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .online-dot {
        width: 5px;
        height: 5px;
        background: #73a58c;
        border-radius: 50%;
        display: inline-block;
      }
      .body-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: calc(100dvh - 73px);
      }
      .body-layout.with-detail {
        grid-template-columns: minmax(0, 1fr) 284px;
      }
      .workspace {
        padding: 24px 32px 23px;
        min-width: 0;
      }
      .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #68717d;
        font-size: 12px;
        min-height: 24px;
        flex-wrap: wrap;
      }
      .breadcrumbs button {
        min-height: 24px;
        padding: 0 2px;
        font-size: 12px;
        color: #6d7784;
      }
      .breadcrumbs svg {
        width: 12px;
        height: 12px;
      }
      .page-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 14px 0 20px;
      }
      .page-title h1 {
        font-size: 29px;
        line-height: 1.3;
        font-weight: 650;
        letter-spacing: -1px;
      }
      .page-title p {
        font-size: 12px;
        color: #68717d;
        margin-top: 8px;
      }
      .title-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .space-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .space-people {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .space-note {
        font-size: 12px;
        color: #68717d;
      }
      .section-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 0 12px;
      }
      .section-line h2 {
        font-size: 12px;
        font-weight: 600;
        color: #636d79;
      }
      .folder-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .folder-card {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 14px 15px;
        text-align: left;
        background: #fff;
        min-width: 0;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .folder-card > svg {
        color: #8a9ebd;
        width: 30px;
        height: 30px;
      }
      .folder-name {
        font-size: 13px;
        font-weight: 550;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .folder-card > div {
        min-width: 0;
      }
      .folder-meta {
        font-size: 11px;
        color: #68717d;
        margin-top: 6px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        margin-top: 22px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .tabs {
        display: flex;
        gap: 20px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        flex: 1;
        min-width: 210px;
      }
      .tab {
        position: relative;
        padding: 8px 0 12px;
        color: #68717d;
        font-size: 12px;
        min-height: 38px;
      }
      .tab.active {
        color: #333c49;
        font-weight: 600;
      }
      .tab.active:after {
        content: "";
        height: 2px;
        background: #4a627f;
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
      }
      .tools {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .tools select {
        font-size: 11px;
        border: 0;
        padding: 6px 8px;
        min-height: 30px;
      }
      .view-switch {
        display: flex;
        padding: 2px;
        background: #f3f5f7;
        border-radius: 6px;
        gap: 2px;
      }
      .view-switch button {
        min-height: 27px;
        height: 27px;
        width: 29px;
        border-radius: 4px;
      }
      .view-switch button.active {
        background: #fff;
        color: #425672;
      }
      .view-switch svg {
        width: 16px;
      }
      .file-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
      }
      .file-table th {
        font-weight: 400;
        color: #68717d;
        font-size: 11px;
        text-align: left;
        height: 34px;
        border-bottom: 1px solid var(--line);
      }
      .file-table th:first-child,
      .file-table td:first-child {
        width: 30px;
      }
      .file-table th:nth-child(3) {
        width: 78px;
      }
      .file-table th:nth-child(4) {
        width: 100px;
      }
      .file-table th:nth-child(5) {
        width: 72px;
      }
      .file-table th:last-child {
        width: 34px;
      }
      .file-table td {
        height: 65px;
        border-bottom: 1px solid #eff1f4;
        color: #68717d;
        vertical-align: middle;
      }
      .file-table tr.selected td {
        background: #f0f4fa;
      }
      .file-table tr:hover td {
        background: #f7f9fc;
      }
      .file-table tr.selected:hover td {
        background: #eaf0f8;
      }
      .file-cell {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }
      .file-name {
        display: block;
        text-align: left;
        max-width: 100%;
        min-height: 25px;
        padding: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
        font-weight: 500;
        color: #3e4652;
      }
      .file-sub {
        color: #68717d;
        font-size: 10px;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file-name-wrap {
        min-width: 0;
      }
      .file-icon {
        height: 34px;
        width: 30px;
        border-radius: 5px;
        background: #eff2f6;
        color: #6f839d;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        position: relative;
      }
      .file-icon svg {
        height: 20px;
        width: 20px;
      }
      .file-icon.pdf {
        background: #faeeee;
        color: #b97070;
      }
      .file-icon.sheet {
        background: #edf4ee;
        color: #75957b;
      }
      .file-icon.image {
        background: #eeeff8;
        color: #8b81aa;
      }
      .file-icon.text {
        background: #eef2f8;
        color: #758eaf;
      }
      .file-icon.folder {
        background: #f0f3f8;
        color: #8198b9;
      }
      .table-size {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .file-table .row-more {
        color: #919aa7;
      }
      .file-footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        color: #68717d;
        font-size: 11px;
        margin-top: 20px;
      }
      .copy-hint {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .copy-hint kbd {
        font-size: 9px;
      }
      .bulk-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #edf3fb;
        border-radius: 7px;
        margin-bottom: 12px;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .bulk-bar .push {
        flex: 1;
      }
      .bulk-bar .btn {
        font-size: 11px;
        padding: 4px 8px;
        min-height: 28px;
      }
      .empty {
        padding: 65px 20px;
        text-align: center;
        color: #68717d;
        border: 1px dashed #dde2e9;
        border-radius: 9px;
        margin-top: 16px;
      }
      .empty svg {
        width: 42px;
        height: 42px;
        color: #b0bac8;
        margin-bottom: 15px;
      }
      .empty h3 {
        font-size: 16px;
        color: #596575;
        font-weight: 500;
      }
      .empty p {
        margin: 10px auto 18px;
        font-size: 12px;
        max-width: 340px;
      }
      .file-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .grid-file {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 16px;
        cursor: pointer;
      }
      .grid-file.selected {
        background: #f2f5fa;
        border-color: #b1c2d7;
      }
      .grid-art {
        height: 100px;
        background: #f7f8fa;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        border-radius: 6px;
      }
      .grid-art .file-icon {
        transform: scale(1.5);
      }
      .grid-file .file-name {
        width: 100%;
      }
      .inspector {
        border-left: 1px solid var(--line);
        padding: 25px 23px;
        background: #fdfdfd;
        min-width: 0;
      }
      .inspector-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #68717d;
        font-size: 12px;
        margin-bottom: 21px;
      }
      .preview-art {
        background: #eff2f6;
        border-radius: 8px;
        padding: 21px 26px;
        min-height: 205px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .paper {
        background: #fff;
        width: 158px;
        min-height: 196px;
        padding: 16px 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        border: 1px solid #e6e9ed;
      }
      .paper-logo {
        font-size: 9px;
        letter-spacing: 3px;
        font-weight: 700;
        color: #333c46;
      }
      .paper-shape {
        width: 62px;
        height: 62px;
        position: relative;
        margin: 22px 0 15px;
        color: #4b5a69;
      }
      .paper-shape:before,
      .paper-shape:after {
        content: "";
        position: absolute;
        width: 28px;
        height: 54px;
        background: #4b5a69;
        border-radius: 1px;
        transform: skewY(-24deg);
      }
      .paper-shape:after {
        left: 32px;
        top: 10px;
        background: #adb9c4;
      }
      .paper-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.5px;
        line-height: 1.4;
      }
      .paper-caption {
        margin-top: 14px;
        font-size: 7px;
        color: #87909a;
      }
      .detail-title {
        font-size: 15px;
        font-weight: 600;
        margin-top: 21px;
        overflow-wrap: anywhere;
      }
      .detail-sub {
        font-size: 11px;
        color: #68717d;
        margin: 6px 0 19px;
      }
      .detail-buttons {
        display: flex;
        gap: 8px;
      }
      .detail-buttons .btn {
        flex: 1;
        font-size: 12px;
        padding: 7px 10px;
      }
      .detail-section {
        border-top: 1px solid var(--line);
        padding-top: 19px;
        margin-top: 21px;
      }
      .detail-section h3 {
        font-size: 11px;
        font-weight: 600;
        color: #68717d;
        margin-bottom: 12px;
      }
      .detail-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        margin: 12px 0;
        color: #707b88;
      }
      .detail-row strong {
        font-weight: 400;
        color: #444e5b;
        text-align: right;
      }
      .detail-event {
        font-size: 11px;
        display: flex;
        gap: 8px;
        color: #76818f;
        margin-top: 15px;
      }
      .event-dot {
        height: 6px;
        width: 6px;
        background: #c8d2df;
        border-radius: 50%;
        margin-top: 5px;
        flex-shrink: 0;
      }
      .permission-explain {
        font-size: 11px;
        color: #68717d;
        line-height: 1.8;
        margin-top: 10px;
      }
      .readonly-hint {
        margin: 17px 0 0;
        padding: 10px 12px;
        background: #faf5e9;
        color: #8b7445;
        font-size: 12px;
        border-radius: 6px;
        display: flex;
        gap: 8px;
      }
      .management-table {
        margin-top: 26px;
        width: 100%;
        border-collapse: collapse;
      }
      .management-table th,
      .management-table td {
        padding: 15px 8px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .management-table th {
        font-size: 11px;
        color: #68717d;
        font-weight: 400;

        if (e.target.matches("[data-check]")) return;
        const row = e.target.closest("[data-select]");
        if (row && !e.target.closest("input,button"))
          selectItem(row.dataset.select, e.ctrlKey || e.metaKey || e.shiftKey);
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "sortSelect") {
          state.sort = t.value;
          render();
        }
        if (t.dataset.check) selectItem(t.dataset.check, true);
        if (t.id === "selectAll") {
          const list = fileList();
          state.selected = t.checked
            ? new Set(list.map((i) => i.id))
            : new Set();
          render();
        }
        if (
          [
            "defaultShareMode",
            "defaultShareDays",
            "defaultShareDownload",
          ].includes(t.id)
        ) {
          model.preferences[model.uid] = {
            mode: $("#defaultShareMode").value,
            days: Number($("#defaultShareDays").value),
            allowDownload: $("#defaultShareDownload").checked,
          };
          notify("默认分享设置已更新，仅影响新链接");
        }
        if (t.id === "defaultLayout") {
          state.layout = t.value;
          notify("默认视图已更新 · 仅本页有效");
        }
        if (t.id === "failNext") {
          state.failNext = t.checked;
          notify(t.checked ? "下一份模拟上传将首次失败" : "已关闭失败模拟");
        }
        if (t.dataset.memberRole) {
          const u = model.users.find((u) => u.id === t.dataset.memberRole);
          if (
            u &&
            u.id !== model.uid &&
            (model.user.admin || model.user.role === "manager")
          ) {
            u.role = t.value;
            notify("示例空间角色已更新");
            render();
          }
        }
      });
      $("#search").addEventListener("input", (e) => {
        state.query = e.target.value;
        state.selected.clear();
        state.detail = "";
        if (["members", "settings"].includes(state.view)) state.view = "team";
        render();
      });
      $("#fileInput").addEventListener("change", (e) => {
        enqueue(e.target.files);
        e.target.value = "";
      });
      $("#transfersBtn").onclick = () => {
        state.panel = !state.panel;
        renderTransfers();
      };

      $("#mobileMenu").onclick = () => {
        $("#sidebar").classList.toggle("open");
        $("#sidebarScrim").classList.toggle("open");
      };
      $("#sidebarScrim").onclick = closeSidebar;
      const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
      $("#searchKey").textContent = isMac ? "⌘ K" : "Ctrl K";
      const editing = (target) =>
        !!target.closest('input,textarea,select,[contenteditable="true"]');
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if ($("#modal").open) return;
          closeSidebar();
          if (state.panel) {
            state.panel = false;
            renderTransfers();
          } else if (state.detail) {
            state.detail = "";
            renderInspector();
          }
          return;
        }
        if ($("#modal").open) return;
        const mod = e.metaKey || e.ctrlKey;
        if (!mod) return;
        if (e.key.toLowerCase() === "k") {
          e.preventDefault();
          $("#search").focus();
          return;
        }
        if (editing(e.target) || window.getSelection()?.toString()) return;
        if (e.key.toLowerCase() === "a" && e.target.closest("#fileArea")) {
          e.preventDefault();
          state.selected = new Set(fileList().map((i) => i.id));
          render();
          $("#fileArea")?.focus();
        }
      });
      document.addEventListener("copy", (event) => {
        if (
          editing(event.target) ||
          $("#modal").open ||
          window.getSelection()?.toString() ||
          !state.selected.size
        )
          return;
        event.preventDefault();
        copyFiles([...state.selected], event.clipboardData);
      });
      document.addEventListener("paste", (e) => {
        if (editing(e.target) || $("#modal").open) return;
        const files = Array.from(e.clipboardData?.files || []);
        if (files.length) {
          e.preventDefault();
          const named = files.map((f) =>
            f.type.startsWith("image/")
              ? new File(
                  [f],
                  `粘贴图片_${Date.now()}_${crypto.randomUUID().slice(0, 6)}.${f.type.split("/")[1] || "png"}`,
                  { type: f.type },
                )
              : f,
          );
          enqueue(named);
          return;
        }
        const text = e.clipboardData?.getData("text/plain") || "";
        if (state.clipboard && text === state.clipboard.marker) {
          e.preventDefault();
          pasteInternal();
          return;
        }
        if (text && currentSpace() && model.canWrite(currentSpace())) {
          e.preventDefault();
          showCreate("text", text.slice(0, 30000));
        }
      });
      document.addEventListener("dragenter", (e) => {
        if (
          !Array.from(e.dataTransfer?.types || []).includes("Files") ||
          $("#modal").open
        )
          return;
        e.preventDefault();
        dragCounter++;
        $("#dropOverlay").hidden = false;
      });
      document.addEventListener("dragover", (e) => {
        if (Array.from(e.dataTransfer?.types || []).includes("Files"))
          e.preventDefault();
      });
      document.addEventListener("dragleave", () => {
        dragCounter = Math.max(0, dragCounter - 1);
        if (!dragCounter) $("#dropOverlay").hidden = true;
      });
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        dragCounter = 0;
        $("#dropOverlay").hidden = true;
        if (!$("#modal").open) enqueue(e.dataTransfer.files);
      });
      function handleShareHash() {
        const raw = location.hash.split("#demo-share=")[1];
        if (!raw) return;
        try {
          showShareLanding(decodeURIComponent(raw), null);
        } catch {
          notify("分享链接格式有误。");
        }
      }
      window.addEventListener("hashchange", handleShareHash);
      window.addEventListener("beforeunload", () => {
        for (const t of state.tasks) {
          clearInterval(t.timer);
          clearTimeout(t.timer);
        }
        temporaryURLs.forEach((u) => URL.revokeObjectURL(u));
      });
      for (const item of model.items) {
        if (item.kind === "folder") continue;
        if (item.id === "notes" && !item.name.endsWith(".txt"))
          item.name += ".txt";
        const blob = originalBlob(item);
        item.file = new File([blob], item.name, { type: blob.type });
        item.size = blob.size;
      }
      render();
      handleShareHash();
    </script>
  </body>
</html>
