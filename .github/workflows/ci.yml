name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/office-share ./cmd/server
