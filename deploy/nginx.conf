# Included in nginx's http context via sites-enabled. Tokens and query strings
# are excluded while method, route, status, client and latency remain observable.
map $uri $office_share_log_path {
    ~^/api/shared/ /api/shared/[redacted];
    default $uri;
}
log_format office_share_privacy escape=json
    '{"ip":"$remote_addr","method":"$request_method","path":"$office_share_log_path","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';

# Use after issuing the domain certificate with the HTTP-only bootstrap config.
server {
    listen 80;
    listen [::]:80;
    server_name office.zpzhub.shop;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/office-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.zpzhub.shop;
    ssl_certificate /etc/letsencrypt/live/office.zpzhub.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.zpzhub.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/office-share.access.log office_share_privacy;
    client_max_body_size 92m;
    client_body_timeout 1800s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # EventSource heartbeat prevents proxy idle disconnection.
        add_header X-Accel-Buffering no;
    }
}
