# Bootstrap HTTP vhost for certificate issuance. Does not change other sites.
server {
    listen 80;
    listen [::]:80;
    server_name office.zpzhub.shop;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/office-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
